<text class="t" x="20" y="105" style="animation-delay:2.97s"><tspan fill="#00285C" font-weight="700">podexit</tspan><tspan fill="#0B1F33"> 0.1.1 · CocoaPods trunk goes read-only on </tspan><tspan fill="#00285C" font-weight="700">2026-12-02</tspan><tspan fill="#0B1F33"> (trial run 2026-11-01 to 2026-11-07)</tspan></text>
