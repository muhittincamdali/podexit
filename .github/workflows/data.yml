name: Data

# Weekly: every source cited in data/publisher-policy.json (and the CocoaPods announcement) must
# still answer, and entries not re-read for 120 days are listed. A failure means a source moved or
# changed; read it again and update the entry and its "checked" date.

on:
  schedule:
    - cron: '37 7 * * 3'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/check-data.ts'
      - '.github/workflows/data.yml'
  workflow_dispatch:

permissions: {}

jobs:
  sources:
    name: Check sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - run: node scripts/check-data.ts
